<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 ภาษาไทย</title>
<meta name="description" content="ท่องศัพท์ Oxford 3000 พร้อมคำอ่านและความหมายภาษาไทย: แฟลชการ์ด แบบทดสอบ เขียนคำ และแต่งประโยค">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --ink:#172033; --muted:#5A6478; --line:#D5DCE6; --soft:#EEF2F7;
  --hero:#0B4F8A; --hero-ink:#FFFFFF; --hero-muted:#CFE2F5;
  --primary:#0B4F8A; --primary-ink:#FFFFFF; --accent:#0B4F8A; --accent-soft:#E3F0FB;
  --good:#1E6B34; --good-soft:#E6F4EA; --bad:#9C1F4A; --bad-soft:#FCE4EC; --warn:#8A4B00; --warn-soft:#FFF1DB;
  --dark:#172033; --dark-ink:#FFFFFF; --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 10px 30px rgba(11,79,138,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --card:#18202F; --ink:#E8EDF5; --muted:#A3AEC0; --line:#2E394C; --soft:#212B3C;
    --hero:#0E3D6B; --hero-ink:#FFFFFF; --hero-muted:#B9D3EE;
    --primary:#2B6CB0; --primary-ink:#FFFFFF; --accent:#8CC2F2; --accent-soft:#17304A;
    --good:#7FD69A; --good-soft:#163222; --bad:#F29BB8; --bad-soft:#3A1828; --warn:#F5BE66; --warn-soft:#3A2A10;
    --dark:#E8EDF5; --dark-ink:#0F1522; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --card:#18202F; --ink:#E8EDF5; --muted:#A3AEC0; --line:#2E394C; --soft:#212B3C;
  --hero:#0E3D6B; --hero-ink:#FFFFFF; --hero-muted:#B9D3EE;
  --primary:#2B6CB0; --primary-ink:#FFFFFF; --accent:#8CC2F2; --accent-soft:#17304A;
  --good:#7FD69A; --good-soft:#163222; --bad:#F29BB8; --bad-soft:#3A1828; --warn:#F5BE66; --warn-soft:#3A2A10;
  --dark:#E8EDF5; --dark-ink:#0F1522; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.shell{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:22px 16px 18px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.3px;line-height:1.2}
.hero p{margin:2px 0 0;font-size:13px;color:var(--hero-muted)}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--hero);display:grid;place-items:center;font-size:12px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#FFFFFF;color:#5A6478;border-radius:12px;padding:0 14px;height:46px}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:#172033;min-width:0}

/* chips */
.chips{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.meta{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--muted)}

/* level badges */
.lv{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.lv-A1{background:var(--good-soft);color:var(--good)}
.lv-A2{background:var(--accent-soft);color:var(--accent)}
.lv-B1{background:var(--warn-soft);color:var(--warn)}
.lv-B2{background:var(--bad-soft);color:var(--bad)}

/* list */
.list{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.row{background:var(--card);border-radius:14px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-word{font-size:17px;font-weight:700}
.row-pos{font-size:12px;color:var(--muted);font-style:italic}
.row-read{font-size:12px;color:var(--muted)}
.row-th{font-size:14px}
.known-dot{font-size:11px;color:var(--good);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.icon-btn.speak{background:var(--accent-soft);color:var(--accent)}
.icon-btn[aria-pressed="true"]{color:#D99A00}
.more{margin:4px 12px 16px;width:calc(100% - 24px);height:48px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.credit{padding:8px 20px 24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.credit button{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:12px;padding:4px}

/* mode screens */
.topbar{padding:18px 16px 6px;display:flex;align-items:center;gap:12px}
.topbar h2{margin:0;flex:1;font-size:17px}
.pill{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:4px 16px 0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .25s}
.segs{display:grid;gap:4px;padding:4px 16px 0}
.segs i{height:6px;border-radius:3px;background:var(--soft)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--primary)}
.pad{padding:0 16px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.flash{width:100%;min-height:380px;border:0;margin-top:14px;justify-content:center}
.big-word{font-size:44px;color:var(--accent);letter-spacing:-.5px;line-height:1.15;word-break:break-word}
.sub{font-size:14px;color:var(--muted)}
.back{width:100%;border-top:1px dashed var(--line);margin-top:10px;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.back .th{font-size:26px;font-weight:700}
.ex{font-size:14px;color:var(--muted);line-height:1.6}
.hint{margin-top:16px;font-size:13px;color:var(--muted)}
.center{display:flex;justify-content:center;padding-top:14px}
.soft-btn{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px 16px}
.btn{height:56px;border-radius:16px;border:0;font-size:16px;font-weight:700;width:100%}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-dark{background:var(--dark);color:var(--dark-ink)}
.btn-good{background:var(--good);color:#FFFFFF}
.btn-outline{background:var(--card);border:2px solid var(--bad);color:var(--bad)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:15px;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-good{color:#0F1522}}
.q-card{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:28px 22px;margin:16px 16px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.q-card .k{font-size:13px;color:var(--hero-muted)}
.q-card .w{font-size:40px;line-height:1.15;word-break:break-word}
.q-card .s{font-size:14px;color:var(--hero-muted)}
.q-card .icon-btn{color:var(--hero-ink);background:rgba(255,255,255,.14)}
.opts{display:flex;flex-direction:column;gap:10px;padding:18px 16px 0}
.opt{min-height:56px;border-radius:16px;padding:10px 14px;border:2px solid var(--line);background:var(--card);font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;text-align:left}
.opt .dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.right .dot{background:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.wrong .dot{background:var(--bad);color:var(--card)}
.fb{margin:14px 16px 0;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.6}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .plain{color:var(--ink)}
.pattern{margin-top:6px;font-size:24px;font-weight:700;letter-spacing:6px;word-break:break-all}
.field{display:flex;flex-direction:column;gap:8px;padding:18px 16px 0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.ans{height:58px;border-radius:16px;padding:0 18px;font-size:22px;font-weight:700;outline:none;width:100%;border:2px solid var(--primary);background:var(--card);color:var(--ink)}
.ans:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.ans.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ans.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.prompt{margin:12px 16px 0;padding:18px 20px;background:var(--card);border-radius:20px;display:flex;flex-direction:column;gap:4px}
.prompt .t{font-size:20px;font-weight:700;line-height:1.5}
.answer-box{margin:14px 16px 0;min-height:112px;padding:14px;border-radius:16px;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:8px;border:2px dashed var(--line);background:var(--soft)}
.answer-box.ok{border:2px solid var(--good);background:var(--good-soft)}
.answer-box.no{border:2px solid var(--bad);background:var(--bad-soft)}
.tile{height:44px;padding:0 14px;border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 0 var(--line)}
.tile.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);box-shadow:none}
.tile.used{border:2px dashed var(--line);background:transparent;color:transparent;box-shadow:none;pointer-events:none}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:18px 16px 0}
.done{padding:48px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .score{font-size:56px;color:var(--accent);line-height:1}
.miss{margin:8px 16px 0;display:flex;flex-direction:column;gap:6px}
.miss div{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:12px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:68px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="shell" id="app" aria-live="polite"></div>

<nav class="nav" aria-label="เมนูหลัก">
  <div class="nav-in">
    <a href="#list" data-r="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>คำศัพท์</a>
    <a href="#flash" data-r="flash"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4h14v14h-4"/></svg>แฟลชการ์ด</a>
    <a href="#quiz" data-r="quiz"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.2-1.5 2.5M12 17h.01"/></svg>แบบทดสอบ</a>
    <a href="#spell" data-r="spell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>เขียนคำ</a>
    <a href="#sentence" data-r="sentence"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="7" height="6" rx="1.5"/><rect x="14" y="5" width="7" height="6" rx="1.5"/><path d="M3 17h18"/></svg>ประโยค</a>
  </div>
</nav>

<script src="data/words.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var LEVELS = ['A1', 'A2', 'B1', 'B2'];
  var ICON_SPEAK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
  var ICON_STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  var ICON_STAR_ON = ICON_STAR.replace('fill="none"', 'fill="currentColor"');
  var ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('o3k_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('o3k_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var W = (window.WORDS || []).map(function (r) {
    var note = (r[0].match(/\((.*?)\)/) || [])[1] || '';
    return { key: r[0], word: r[0].replace(/\s*\(.*?\)\s*/g, '').trim(), note: note, pos: r[1], level: r[2], read: r[3], th: r[4] };
  });
  W.forEach(function (w) { w.ans = w.word.toLowerCase(); });
  var byKey = {}; W.forEach(function (w) { byKey[w.key] = w; });
  var S = window.SENTENCES || [];
  function exampleFor(key) {
    for (var i = 0; i < S.length; i++) if (S[i][2] === key) return S[i];
    return null;
  }

  var known = new Set(store.get('known', []));
  var saved = new Set(store.get('saved', []));
  var level = store.get('level', 'all');
  if (level !== 'all' && LEVELS.indexOf(level) < 0) level = 'all';
  function saveSets() { store.set('known', Array.from(known)); store.set('saved', Array.from(saved)); }
  function pool() { return level === 'all' ? W : W.filter(function (w) { return w.level === level; }); }

  var voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = window.speechSynthesis.getVoices();
    voice = vs.find(function (v) { return /en[-_]US/i.test(v.lang); }) || vs.find(function (v) { return /^en/i.test(v.lang); }) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9; if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function lvBadge(l) { return '<span class="lv lv-' + l + '">' + l + '</span>'; }
  function levelChips() {
    var opts = [['all', 'ทั้งหมด']].concat(LEVELS.map(function (l) { return [l, l]; }));
    return '<div class="chips" role="group" aria-label="เลือกระดับ">' + opts.map(function (o) {
      return '<button class="chip" data-act="level" data-v="' + o[0] + '" aria-pressed="' + (level === o[0]) + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  function topbar(title, right) {
    return '<div class="topbar"><a class="icon-btn" href="#list" aria-label="กลับหน้าคำศัพท์" style="background:var(--card);color:var(--ink)">' + ICON_BACK + '</a><h2>' + title + '</h2>' + (right || '') + '</div>';
  }

  /* ---------- state ---------- */
  var st = { listQ: '', listSaved: false, listLimit: 200 };
  var route = 'list';

  /* ---------- LIST ---------- */
  function viewList() {
    var p = pool();
    var k = p.filter(function (w) { return known.has(w.key); }).length;
    var pct = p.length ? Math.round(k / p.length * 100) : 0;
    app.innerHTML =
      '<header class="hero"><div class="hero-top"><div><h1 class="serif">Oxford 3000</h1><p>ศัพท์สำคัญ ' + W.length.toLocaleString() + ' คำ · ระดับ A1–B2 · คำอ่านและความหมายไทย</p></div>' +
      '<div class="ring" style="background:conic-gradient(#F5B841 0 ' + pct + '%, rgba(255,255,255,.2) ' + pct + '% 100%)" role="img" aria-label="จำได้แล้ว ' + pct + ' เปอร์เซ็นต์"><span>' + pct + '%</span></div></div>' +
      '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      '<span class="sr">ค้นหาคำศัพท์</span><input id="q" type="search" placeholder="ค้นหาคำศัพท์ หรือความหมายภาษาไทย" value="' + esc(st.listQ) + '" autocomplete="off"></label></header>' +
      levelChips().replace('</div>', '<button class="chip" data-act="savedOnly" aria-pressed="' + st.listSaved + '">★ ที่บันทึก</button></div>') +
      '<div class="meta"><span id="count"></span><span>จำได้แล้ว ' + k + '/' + p.length + '</span></div>' +
      '<div class="list" id="list"></div><div id="more"></div>' +
      '<div class="credit">ขอบคุณคำศัพท์จาก Oxford Learner\'s Dictionaries (The Oxford 3000™ © Oxford University Press)<br>คำอ่านและความหมาย a–component จากเพจ KruDew TOEIC · ทำเพื่อแจกฟรี ไม่อนุญาตให้จำหน่าย<br><button data-act="reset">ล้างความคืบหน้าทั้งหมด</button></div>';
    document.getElementById('q').addEventListener('input', function (e) { st.listQ = e.target.value; st.listLimit = 200; renderRows(); });
    renderRows();
  }
  function renderRows() {
    var q = st.listQ.trim().toLowerCase();
    var rows = pool().filter(function (w) {
      if (st.listSaved && !saved.has(w.key)) return false;
      if (!q) return true;
      return w.key.toLowerCase().indexOf(q) >= 0 || w.th.indexOf(q) >= 0 || w.read.indexOf(q) >= 0;
    });
    document.getElementById('count').textContent = rows.length.toLocaleString() + ' คำ';
    var list = document.getElementById('list');
    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (st.listSaved ? 'ยังไม่มีคำที่บันทึกไว้ กด ☆ ที่คำศัพท์เพื่อบันทึก' : 'ไม่พบคำที่ค้นหา') + '</div>';
      document.getElementById('more').innerHTML = '';
      return;
    }
    list.innerHTML = rows.slice(0, st.listLimit).map(function (w) {
      var on = saved.has(w.key);
      return '<div class="row"><div class="row-main"><div class="row-head"><span class="row-word">' + esc(w.word) + '</span>' +
        (w.note ? '<span class="row-pos">(' + esc(w.note) + ')</span>' : '') +
        '<span class="row-pos">' + esc(w.pos) + '</span>' + lvBadge(w.level) +
        (known.has(w.key) ? '<span class="known-dot">✓ จำแล้ว</span>' : '') + '</div>' +
        '<span class="row-read">' + esc(w.read) + '</span><span class="row-th">' + esc(w.th) + '</span></div>' +
        '<button class="icon-btn" data-act="star" data-k="' + esc(w.key) + '" aria-pressed="' + on + '" aria-label="บันทึกคำ ' + esc(w.word) + '">' + (on ? ICON_STAR_ON : ICON_STAR) + '</button>' +
        '<button class="icon-btn speak" data-act="speak" data-t="' + esc(w.word) + '" aria-label="ฟังเสียง ' + esc(w.word) + '">' + ICON_SPEAK + '</button></div>';
    }).join('');
    document.getElementById('more').innerHTML = rows.length > st.listLimit ? '<button class="more" data-act="more">แสดงเพิ่ม (เหลืออีก ' + (rows.length - st.listLimit) + ' คำ)</button>' : '';
  }

  /* ---------- FLASHCARDS ---------- */
  function newFlash() {
    var p = shuffle(pool());
    p.sort(function (a, b) { return (known.has(a.key) ? 1 : 0) - (known.has(b.key) ? 1 : 0); });
    st.flash = { deck: p.slice(0, 20), i: 0, back: false, got: 0 };
  }
  function viewFlash() {
    if (!st.flash) newFlash();
    var f = st.flash, n = f.deck.length;
    if (f.i >= n) {
      app.innerHTML = topbar('แฟลชการ์ด') + levelChips() +
        '<div class="done"><div class="score serif">' + f.got + '</div><div>คำที่จำได้ในรอบนี้</div><p class="sub">คำที่ยังไม่จำถูกวนกลับมาให้ทบทวนแล้ว</p>' +
        '<button class="btn btn-primary" data-act="flashNew" style="max-width:320px">เริ่มชุดใหม่</button></div>';
      return;
    }
    var c = f.deck[f.i], ex = exampleFor(c.key);
    app.innerHTML = topbar('แฟลชการ์ด', '<span class="pill" style="background:var(--soft);color:var(--muted)">' + (f.i + 1) + ' / ' + n + '</span>') +
      '<div class="bar"><i style="width:' + Math.round((f.i + 1) / n * 100) + '%"></i></div>' + levelChips() +
      '<div class="pad"><button class="card flash" data-act="flip" aria-label="พลิกการ์ด">' + lvBadge(c.level) +
      '<span class="big-word serif">' + esc(c.word) + '</span><span class="sub"><i>' + esc(c.pos) + '</i>' + (c.note ? ' (' + esc(c.note) + ')' : '') + ' · ' + esc(c.read) + '</span>' +
      (f.back ? '<div class="back"><span class="th">' + esc(c.th) + '</span>' + (ex ? '<span class="ex">' + esc(ex[0]) + '.<br>' + esc(ex[1]) + '</span>' : '') + '</div>'
              : '<span class="hint">แตะการ์ดเพื่อดูความหมาย</span>') +
      '</button></div><div class="center"><button class="soft-btn" data-act="speak" data-t="' + esc(c.word) + '">' + ICON_SPEAK + 'ฟังเสียง</button></div>' +
      '<div class="actions"><button class="btn btn-outline" data-act="nope">ยังไม่จำ</button><button class="btn btn-good" data-act="yep">จำได้แล้ว ✓</button></div>' +
      '<p class="sub" style="text-align:center;margin:0 16px">คำที่ยังไม่จำจะวนกลับมาให้ทบทวนอีกครั้ง</p>';
  }

  /* ---------- QUIZ ---------- */
  function newQuiz() {
    var qs = shuffle(pool()).slice(0, 10).map(function (w) {
      var wrong = [];
      shuffle(W).some(function (x) { if (x.th !== w.th && wrong.indexOf(x.th) < 0) wrong.push(x.th); return wrong.length === 3; });
      return { w: w, opts: shuffle([w.th].concat(wrong)) };
    });
    st.quiz = { qs: qs, i: 0, picked: null, res: [] };
  }
  function viewQuiz() {
    if (!st.quiz) newQuiz();
    var z = st.quiz, n = z.qs.length, score = z.res.filter(Boolean).length;
    if (z.i >= n) {
      var miss = z.qs.filter(function (q, i) { return !z.res[i]; });
      app.innerHTML = topbar('แบบทดสอบ') + levelChips() +
        '<div class="done"><div class="score serif">' + score + '/' + n + '</div><div>' + (score >= 8 ? 'เก่งมาก!' : score >= 5 ? 'ดีแล้ว ฝึกต่ออีกนิด' : 'ไม่เป็นไร ลองทบทวนแล้วทำใหม่') + '</div></div>' +
        (miss.length ? '<div class="pad sub">คำที่ตอบผิด</div><div class="miss">' + miss.map(function (q) { return '<div><strong>' + esc(q.w.word) + '</strong><span>' + esc(q.w.th) + '</span></div>'; }).join('') + '</div>' : '') +
        '<div class="pad" style="padding-top:18px"><button class="btn btn-primary" data-act="quizNew">ทำชุดใหม่</button></div>';
      return;
    }
    var q = z.qs[z.i], letters = ['A', 'B', 'C', 'D'];
    var segs = z.qs.map(function (x, i) { return '<i class="' + (i < z.res.length ? (z.res[i] ? 'ok' : 'no') : i === z.i ? 'cur' : '') + '"></i>'; }).join('');
    app.innerHTML = topbar('แบบทดสอบ · ข้อ ' + (z.i + 1) + '/' + n, '<span class="pill" style="background:var(--warn-soft);color:var(--warn)">คะแนน ' + score + '</span>') +
      '<div class="segs" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + segs + '</div>' + levelChips() +
      '<section class="q-card"><span class="k">คำนี้แปลว่าอะไร?</span><span class="w serif">' + esc(q.w.word) + '</span><span class="s"><i>' + esc(q.w.pos) + '</i> · ' + esc(q.w.read) + ' · ' + q.w.level + '</span>' +
      '<button class="icon-btn" data-act="speak" data-t="' + esc(q.w.word) + '" aria-label="ฟังเสียง">' + ICON_SPEAK + '</button></section>' +
      '<div class="opts">' + q.opts.map(function (o, i) {
        var cls = '';
        if (z.picked !== null) { if (o === q.w.th) cls = ' right'; else if (i === z.picked) cls = ' wrong'; }
        return '<button class="opt' + cls + '" data-act="pick" data-i="' + i + '"' + (z.picked !== null ? ' disabled' : '') + '><span class="dot">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>' +
      (z.picked !== null ? (function () {
        var ok = q.opts[z.picked] === q.w.th, ex = exampleFor(q.w.key);
        return '<div class="fb ' + (ok ? 'ok' : 'no') + '"><strong>' + (ok ? 'ถูกต้อง!' : 'ยังไม่ใช่') + '</strong> ' + esc(q.w.word) + ' = ' + esc(q.w.th) +
          (ex ? '<br><span class="plain">' + esc(ex[0]) + '.</span>' : '') + '</div>' +
          '<div class="pad" style="padding-top:16px;padding-bottom:16px"><button class="btn btn-dark" data-act="quizNext">' + (z.i + 1 < n ? 'ข้อต่อไป →' : 'ดูผลคะแนน') + '</button></div>';
      })() : '');
  }

  /* ---------- SPELLING ---------- */
  function newSpell() {
    var p = pool().filter(function (w) { return /^[a-z]{2,}$/.test(w.ans); });
    st.spell = { qs: shuffle(p).slice(0, 10), i: 0, value: '', hints: 1, checked: false, ok: false, score: 0, retried: {} };
  }
  function viewSpell() {
    if (!st.spell) newSpell();
    var s = st.spell, n = s.qs.length;
    if (s.i >= n) {
      app.innerHTML = topbar('เขียนคำศัพท์') + levelChips() +
        '<div class="done"><div class="score serif">' + s.score + '</div><div>คำที่เขียนถูก</div><button class="btn btn-primary" data-act="spellNew" style="max-width:320px">เริ่มชุดใหม่</button></div>';
      return;
    }
    var q = s.qs[s.i];
    var pat = q.ans.split('').map(function (c, i) { return i < s.hints ? c : '_'; }).join(' ');
    app.innerHTML = topbar('เขียนคำศัพท์ · ข้อ ' + (s.i + 1) + '/' + n, '<span class="pill" style="background:var(--good-soft);color:var(--good)">ถูก ' + s.score + '</span>') + levelChips() +
      '<div class="pad"><section class="card" style="margin-top:4px"><span class="sub">พิมพ์คำภาษาอังกฤษที่แปลว่า</span><span style="font-size:30px;font-weight:700;color:var(--accent);line-height:1.35">' + esc(q.th) + '</span>' +
      '<span class="sub"><i>' + esc(q.pos) + '</i> · ' + q.level + ' · ' + q.ans.length + ' ตัวอักษร</span><div class="pattern mono" aria-label="คำใบ้">' + esc(pat) + '</div></section></div>' +
      '<div class="field"><label for="ans">คำตอบของคุณ</label><input id="ans" class="ans mono' + (s.checked ? (s.ok ? ' ok' : ' no') : '') + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์ภาษาอังกฤษตรงนี้" value="' + esc(s.value) + '"' + (s.checked ? ' readonly' : '') + '>' +
      '<div class="two"><button class="tool" data-act="hint" style="color:var(--warn)"' + (s.checked ? ' disabled' : '') + '>ใบ้ 1 ตัวอักษร</button><button class="tool" data-act="speak" data-t="' + esc(q.word) + '" style="color:var(--accent)">' + ICON_SPEAK + 'ฟังเสียง</button></div></div>' +
      (s.checked ? '<div class="fb ' + (s.ok ? 'ok' : 'no') + '">' + (s.ok ? '<strong>ถูกต้อง! ' + esc(q.word) + '</strong>' : '<strong>ยังไม่ถูก</strong> คำที่ถูกคือ <strong>' + esc(q.word) + '</strong><br><span class="plain">คำนี้จะกลับมาให้ฝึกอีกครั้งท้ายชุด</span>') + '</div>' : '') +
      '<div class="pad" style="padding-top:18px;padding-bottom:16px">' + (s.checked ? '<button class="btn btn-dark" data-act="spellNext">ข้อต่อไป →</button>' : '<button class="btn btn-primary" data-act="spellCheck">ตรวจคำตอบ</button>') + '</div>';
    var inp = document.getElementById('ans');
    inp.addEventListener('input', function (e) { s.value = e.target.value; });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); act(s.checked ? 'spellNext' : 'spellCheck'); } });
    if (!s.checked) setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 30);
  }

  /* ---------- SENTENCE ---------- */
  function newSentence() {
    var qs = shuffle(S).slice(0, 5).map(function (r) {
      var words = r[0].split(' '), idx = words.map(function (_, i) { return i; }), order = shuffle(idx), tries = 0;
      while (words.length > 1 && order.join() === idx.join() && tries++ < 10) order = shuffle(idx);
      return { en: r[0], th: r[1], key: r[2], words: words, order: order };
    });
    st.sen = { qs: qs, i: 0, picked: [], checked: false, score: 0 };
  }
  function viewSentence() {
    if (!st.sen) newSentence();
    var z = st.sen, n = z.qs.length;
    if (z.i >= n) {
      app.innerHTML = topbar('แต่งประโยค') + '<div class="done"><div class="score serif">' + z.score + '/' + n + '</div><div>ประโยคที่เรียงถูก</div><button class="btn btn-primary" data-act="senNew" style="max-width:320px">ทำชุดใหม่</button></div>';
      return;
    }
    var q = z.qs[z.i], w = byKey[q.key];
    var built = z.picked.map(function (k) { return q.words[k]; }).join(' ');
    var ok = built === q.en;
    app.innerHTML = topbar('แต่งประโยค · ข้อ ' + (z.i + 1) + '/' + n, '<span class="pill" style="background:var(--good-soft);color:var(--good)">ถูก ' + z.score + '</span>') +
      (w ? '<div class="pad" style="padding-top:8px"><span class="tag">คำศัพท์ข้อนี้: <strong>' + esc(w.word) + '</strong> = ' + esc(w.th) + '</span></div>' : '') +
      '<section class="prompt"><span class="sub">เรียงคำให้เป็นประโยคที่แปลว่า</span><span class="t">“' + esc(q.th) + '”</span></section>' +
      '<div class="answer-box' + (z.checked ? (ok ? ' ok' : ' no') : '') + '" aria-label="ประโยคของคุณ">' +
      (z.picked.length ? z.picked.map(function (k) { return '<button class="tile on" data-act="unpick" data-k="' + k + '"' + (z.checked ? ' disabled' : '') + '>' + esc(q.words[k]) + '</button>'; }).join('') : '<span class="sub">แตะคำด้านล่างเพื่อเรียงประโยค</span>') +
      '</div><div class="bank">' + q.order.map(function (k) {
        var used = z.picked.indexOf(k) >= 0;
        return '<button class="tile' + (used ? ' used' : '') + '" data-act="tile" data-k="' + k + '"' + (used || z.checked ? ' disabled' : '') + (used ? ' aria-hidden="true" tabindex="-1"' : '') + '>' + esc(q.words[k]) + '</button>';
      }).join('') + '</div>' +
      (z.checked ? '<div class="fb ' + (ok ? 'ok' : 'no') + '">' + (ok ? '<strong>ถูกต้อง!</strong> ' + esc(q.en) + '.' : '<strong>ยังไม่ถูก</strong> ประโยคที่ถูกคือ<br><span class="plain"><strong>' + esc(q.en) + '.</strong></span>') + '</div>' : '') +
      '<div class="pad" style="padding-top:18px;padding-bottom:16px;display:flex;gap:12px">' +
      (z.checked ? '<button class="btn btn-ghost" data-act="speak" data-t="' + esc(q.en) + '" style="width:auto;padding:0 18px" aria-label="ฟังประโยค">' + ICON_SPEAK + '</button><button class="btn btn-dark" data-act="senNext">ข้อต่อไป →</button>'
                 : '<button class="btn btn-ghost" data-act="senClear" style="width:auto;padding:0 20px">ล้าง</button><button class="btn btn-primary" data-act="senCheck"' + (z.picked.length ? '' : ' disabled style="opacity:.5"') + '>ตรวจคำตอบ</button>') + '</div>';
  }

  /* ---------- actions ---------- */
  var views = { list: viewList, flash: viewFlash, quiz: viewQuiz, spell: viewSpell, sentence: viewSentence };
  function render() { views[route](); }

  function act(a, el) {
    var f = st.flash, z = st.quiz, s = st.spell, n = st.sen;
    switch (a) {
      case 'speak': speak(el.getAttribute('data-t')); return;
      case 'level':
        level = el.getAttribute('data-v'); store.set('level', level);
        st.flash = st.quiz = st.spell = null; st.listLimit = 200; break;
      case 'savedOnly': st.listSaved = !st.listSaved; break;
      case 'star': {
        var k = el.getAttribute('data-k');
        if (saved.has(k)) saved.delete(k); else saved.add(k);
        saveSets(); renderRows(); return;
      }
      case 'more': st.listLimit += 300; renderRows(); return;
      case 'armReset': st.armReset = true; break;
      case 'resetCancel': st.armReset = false; break;
      case 'reset': known.clear(); saved.clear(); saveSets(); st.armReset = false; break;
      case 'flip': f.back = !f.back; break;
      case 'yep': known.add(f.deck[f.i].key); saveSets(); f.got++; f.i++; f.back = false; break;
      case 'nope': {
        var c = f.deck[f.i]; known.delete(c.key); saveSets();
        if (f.deck.length < 40) f.deck.push(c);
        f.i++; f.back = false; break;
      }
      case 'flashNew': newFlash(); break;
      case 'pick':
        if (z.picked !== null) return;
        z.picked = +el.getAttribute('data-i');
        z.res.push(z.qs[z.i].opts[z.picked] === z.qs[z.i].w.th);
        break;
      case 'quizNext': z.i++; z.picked = null; break;
      case 'quizNew': newQuiz(); break;
      case 'hint': s.hints = Math.min(s.qs[s.i].ans.length, s.hints + 1); break;
      case 'spellCheck': {
        if (s.checked) return;
        var q = s.qs[s.i];
        var typed = s.value.trim().toLowerCase();
        // ยอมรับคำที่มีความหมายเดียวกัน เช่น bike / bicycle = จักรยาน
        s.ok = typed === q.ans || W.some(function (x) { return x.th === q.th && x.ans === typed; });
        s.checked = true;
        if (s.ok) { s.score++; known.add(q.key); saveSets(); }
        else if (!s.retried[q.key]) { s.retried[q.key] = 1; s.qs.push(q); }
        break;
      }
      case 'spellNext': s.i++; s.value = ''; s.hints = 1; s.checked = false; s.ok = false; break;
      case 'spellNew': newSpell(); break;
      case 'tile': { var t = +el.getAttribute('data-k'); if (n.picked.indexOf(t) < 0) n.picked.push(t); break; }
      case 'unpick': { var u = +el.getAttribute('data-k'); n.picked = n.picked.filter(function (x) { return x !== u; }); break; }
      case 'senClear': n.picked = []; break;
      case 'senCheck': {
        var sq = n.qs[n.i];
        if (!n.picked.length) return;
        n.checked = true;
        if (n.picked.map(function (k2) { return sq.words[k2]; }).join(' ') === sq.en) n.score++;
        break;
      }
      case 'senNext': n.i++; n.picked = []; n.checked = false; break;
      case 'senNew': newSentence(); break;
      default: return;
    }
    render();
  }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && app.contains(el) && !el.disabled) act(el.getAttribute('data-act'), el);
  });

  function onRoute() {
    var r = (location.hash || '#list').slice(1);
    route = views[r] ? r : 'list';
    document.querySelectorAll('.nav a').forEach(function (a) {
      if (a.getAttribute('data-r') === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
